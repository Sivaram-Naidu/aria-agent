<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARIA — Your Companion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">

        <!-- Header -->
        <div class="header">
            <div class="avatar">✨</div>
            <div class="header-info">
                <h1>ARIA</h1>
                <div class="status">
                    <div class="status-dot"></div>
                    <span id="status">online</span>
                </div>
            </div>
            <div class="emotion-badge" id="emotionBadge">😐 Neutral</div>
        </div>

        <!-- Chat messages -->
        <div class="chat-area" id="chatArea"></div>

        <!-- Wake up notice -->
        <div class="wake-notice" id="wakeNotice"></div>

        <!-- Input area -->
        <div class="input-area">
            <div class="input-row">
                <!-- Voice mic button (hidden by default) -->
                <button class="btn btn-voice"
                        id="voiceBtn"
                        title="Hold to speak"
                        style="display:none">
                    🎙️
                </button>

                <input
                    type="text"
                    class="text-input"
                    id="textInput"
                    placeholder="Message ARIA..."
                    autocomplete="off"
                />

                <button class="btn btn-send" id="sendBtn">➤</button>
            </div>

            <!-- Voice mode toggle -->
            <div class="mode-row">
                <span class="mode-label">Text</span>
                <label class="toggle">
                    <input type="checkbox" id="voiceToggle">
                    <span class="toggle-slider"></span>
                </label>
                <span class="mode-label">Voice</span>
            </div>
        </div>

    </div>

    <script src="app.js"></script>
</body>
</html>
