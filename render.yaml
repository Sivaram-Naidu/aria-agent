services:
  - type: web
    name: aria-backend
    runtime: python3
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: ARIA_MODEL
        value: llama-3.3-70b-versatile
